services:
  blog-jokester:
    build:
      context: .
      target: full
    # image: blog-jokester/backend:latest
    container_name: blog-jokester
    depends_on:
      - blog_jokester_postgresql
      - blog_jokester_redis
    restart: always
    ports:
      - 8091:8091
    environment:
      - ANHEYU_DATABASE_TYPE=postgres
      - ANHEYU_DATABASE_HOST=blog_jokester_postgresql
      - ANHEYU_DATABASE_USER=anheyu
      - ANHEYU_DATABASE_NAME=anheyu
      - ANHEYU_DATABASE_PORT=5432
      - ANHEYU_DATABASE_PASSWORD=${ANHEYU_DATABASE_PASSWORD:-changeme}
      - ANHEYU_REDIS_ADDR=blog_jokester_redis:6379
      - ANHEYU_REDIS_PASSWORD=${ANHEYU_REDIS_PASSWORD:-changeme}
    volumes:
      - ./data:/anheyu/data
      - ./themes:/anheyu/themes
      - ./static:/anheyu/static
      - ./backup:/anheyu/backup

  blog_jokester_postgresql:
    # Best practice: Pin to major version.
    # NOTE: For major version jumps:
    # backup & consult https://www.postgresql.org/docs/current/pgupgrade.html
    image: postgres:17
    container_name: blog_jokester_postgresql
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=anheyu
      - POSTGRES_DB=anheyu
      - POSTGRES_PASSWORD=${ANHEYU_DATABASE_PASSWORD:-changeme}
    volumes:
      - blog_jokester_database_postgres:/var/lib/postgresql/data

  blog_jokester_redis:
    image: redis:latest
    container_name: blog_jokester_redis
    command: >
      redis-server --requirepass ${ANHEYU_REDIS_PASSWORD:-changeme}
    expose:
      - "6379"
    volumes:
      - blog_jokester_redis_data:/data

volumes:
  blog_jokester_database_postgres:
  blog_jokester_redis_data:
